<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="Lev Space, barberia su appuntamento: prenota il tuo taglio online."
    />
    <meta name="theme-color" content="#121214" />
    <title>Accedi · Lev Space</title>
    <link
      rel="preload"
      href="/fonts/libre-franklin-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/styles/app.css" />
    <link rel="stylesheet" href="/styles/pages.css" />
    <script src="/js/theme-init.js"></script>
  </head>

  <body class="no-tabbar auth-page">
    <a class="skip-link" href="#main">Vai al contenuto</a>
    <header class="appbar">
      <a class="wordmark" href="/">Lev Space</a>
      <button
        type="button"
        class="btn btn--icon"
        data-theme-toggle
        aria-pressed="false"
        aria-label="Tema scuro"
      >
        <svg
          viewBox="0 0 24 24"
          width="24"
          height="24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="square"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="8" />
          <path d="M12 4a8 8 0 010 16z" fill="currentColor" />
        </svg>
      </button>
    </header>

    <main id="main" class="page page--narrow">
      <div class="page-head">
        <h1>Accedi</h1>
        <p>Per prendere, spostare o cancellare i tuoi turni.</p>
      </div>
      <div class="ticket auth">
        <p class="notice" id="form-info" role="status" hidden></p>
        <form id="login-form" class="stack" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input
              class="input"
              id="email"
              name="email"
              type="email"
              autocomplete="username"
              inputmode="email"
              autocapitalize="off"
              spellcheck="false"
              required
            />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="password-field">
              <input
                class="input"
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="btn btn--quiet"
                data-reveal="password"
                aria-pressed="false"
                aria-label="Mostra password"
              >
                Mostra
              </button>
            </div>
          </div>
          <p class="notice notice--error" id="form-error" role="alert" hidden></p>
          <button class="btn btn--primary btn--block" type="submit">Accedi</button>
        </form>
        <div class="ticket__foot auth__links">
          <a href="/reset-password">Password dimenticata?</a>
          <a href="/register">Crea un account</a>
          <a href="/guest-booking">Prenota senza account</a>
        </div>
      </div>
    </main>

    <script src="/js/theme.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>
