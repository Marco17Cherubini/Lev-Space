<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accedi - Lev Space</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/js/theme-init.js"></script>
  </head>

  <body>
    <main class="center-container">
      <div class="form">
        <h1 class="text-center h2">Accedi</h1>

        <div id="success-message" role="status" class="form-success hidden"></div>
        <div id="error-message" role="alert" class="form-error hidden"></div>

        <form id="login-form">
          <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              required
              placeholder="mario.rossi@example.com"
            />
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              required
              placeholder="La tua password"
            />
          </div>

          <button type="submit" class="btn btn-full">Accedi</button>
        </form>

        <p class="text-center mt-2">
          Non hai un account? <a href="/register" class="link">Registrati</a>
        </p>
        <p class="text-center" style="margin-top: 8px">
          <a href="/reset-password" class="link">Password dimenticata?</a>
        </p>
      </div>
    </main>

    <script src="/js/theme.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/login.js"></script>
  </body>
</html>
