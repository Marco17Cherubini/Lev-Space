<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestione Clienti - Lev Space</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <!-- Sidebar Overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Sidebar Menu -->
    <div id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <span>Menu Admin</span>
        <button id="close-sidebar" class="sidebar-close">&times;</button>
      </div>
      <nav class="sidebar-nav">
        <a href="/admin" class="sidebar-item">Menu Admin</a>
        <a href="/admin/reports" class="sidebar-item">Resoconto Clientela</a>
        <button id="sidebar-logout" class="sidebar-item sidebar-logout">Logout</button>
      </nav>
    </div>

    <div class="header">
      <div class="header-left">
        <button id="hamburger-btn" class="hamburger-btn">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div class="header-title">Lev Space</div>
      </div>
    </div>

    <div class="container">
      <h2 class="page-title">Gestione Clienti</h2>
      <p class="page-subtitle">Gestisci lo stato VIP e BAN dei clienti</p>

      <div class="clienti-container">
        <div class="search-box">
          <input
            type="text"
            id="search-input"
            class="search-input"
            placeholder="Cerca per nome o cognome..."
          />
        </div>

        <div id="users-count" class="users-count"></div>

        <div id="users-list" class="users-list">
          <div class="no-users">Caricamento...</div>
        </div>
      </div>
    </div>

    <!-- Barra conferma modifiche -->
    <div id="confirm-bar" class="confirm-bar">
      <div class="changes-info">
        <span id="changes-count">0 modifiche</span> in attesa di conferma
      </div>
      <div>
        <button id="cancel-changes-btn" class="btn-cancel">Annulla</button>
        <button id="confirm-changes-btn" class="btn-confirm">Conferma</button>
      </div>
    </div>

    <script src="/js/theme.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/layout.js"></script>
    <script src="/js/admin-clienti.js"></script>
  </body>
</html>
