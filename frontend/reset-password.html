<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="Lev Space, barberia su appuntamento: prenota il tuo taglio online."
    />
    <meta name="theme-color" content="#ece8df" />
    <title>Recupera la password · Lev Space</title>
    <link
      rel="preload"
      href="/fonts/libre-franklin-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/styles/app.css" />
    <link rel="stylesheet" href="/styles/pages.css" />
    <script src="/js/theme-init.js"></script>
  </head>

  <body class="no-tabbar">
    <a class="skip-link" href="#main">Vai al contenuto</a>
    <header class="appbar">
      <a class="wordmark" href="/">Lev Space</a>
      <button
        type="button"
        class="btn btn--icon"
        data-theme-toggle
        aria-pressed="false"
        aria-label="Tema scuro"
      >
        <svg
          viewBox="0 0 24 24"
          width="24"
          height="24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="square"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="8" />
          <path d="M12 4a8 8 0 010 16z" fill="currentColor" />
        </svg>
      </button>
    </header>

    <main id="main" class="page page--narrow">
      <div class="ticket auth">
        <div class="ticket__body stack">
          <h1>Recupera la password</h1>
          <p class="serif muted">
            Scrivi l'email del tuo account: ti mandiamo un link valido per un'ora, utilizzabile una
            sola volta.
          </p>
          <form id="reset-form" class="stack" novalidate>
            <div class="field">
              <label for="email">Email</label>
              <input
                class="input"
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                inputmode="email"
                autocapitalize="off"
                spellcheck="false"
                required
              />
            </div>
            <p class="notice" id="form-info" role="status" hidden></p>
            <p class="notice notice--error" id="form-error" role="alert" hidden></p>
            <button class="btn btn--primary btn--block" type="submit">Invia il link</button>
          </form>
        </div>
        <div class="ticket__stub">
          <p><a href="/login">Torna all'accesso</a></p>
        </div>
      </div>
    </main>

    <script src="/js/theme.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>
