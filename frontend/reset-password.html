<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recupera Password - Lev Space</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="/js/theme-init.js"></script>
  </head>

  <body>
    <main class="center-container">
      <div class="form">
        <h1 class="text-center h2">Recupera Password</h1>
        <p class="text-center" style="color: var(--color-text-secondary); margin-bottom: 24px">
          Inserisci la tua email e ti invieremo un link per reimpostare la password.
        </p>

        <div id="success-message" role="status" class="form-success hidden"></div>
        <div id="error-message" role="alert" class="form-error hidden"></div>

        <form id="reset-form">
          <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-input"
              required
              placeholder="mario.rossi@example.com"
            />
          </div>

          <button type="submit" class="btn btn-full">Invia Link di Reset</button>
        </form>

        <p class="text-center mt-2">
          <a href="/login" class="link">Torna al Login</a>
        </p>
      </div>
    </main>

    <script src="/js/theme.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/reset-password.js"></script>
  </body>
</html>
